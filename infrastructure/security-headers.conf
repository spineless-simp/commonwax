# nginx's `add_header` does not inherit into a location block that declares any
# `add_header` of its own, so these are kept in one file and included wherever
# they are needed rather than repeated and left to drift.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

# The app is fully self-hosted: scripts, styles, fonts, artwork, and audio all
# come from this origin, so nothing needs to be allowed off it. `unsafe-inline`
# is granted to styles only (React and Motion write inline styles) and never to
# scripts, which is where it would matter for XSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
