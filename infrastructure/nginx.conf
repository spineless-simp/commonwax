server {
  listen 80;
  server_name _;
  server_tokens off;

  # This applies to the whole multipart album upload. Individual files are
  # still limited to 1 GiB by the API, and the batch to 20 GiB.
  client_max_body_size 20g;

  include /etc/nginx/security-headers.conf;

  location /api/ {
    include /etc/nginx/security-headers.conf;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # An import answers only once Navidrome's scan has finished, and that wait
    # is capped at 90s inside the API. This has to stay comfortably above it, or
    # nginx reports a 504 for an import that is still running and will succeed.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # Build assets carry a content hash in their name, so they can be cached
  # indefinitely. index.html must not be, or a deploy leaves clients pinned to
  # a stale bundle that references assets that no longer exist.
  location /assets/ {
    root /usr/share/nginx/html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location = /index.html {
    root /usr/share/nginx/html;
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
}
